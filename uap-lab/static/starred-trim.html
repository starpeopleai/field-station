<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trim recording · Field Station</title><link rel="stylesheet" href="/style.css"><style>main{max-width:960px;margin:auto;padding:16px}video{display:block;width:100%;max-height:68vh;background:#111;margin:12px 0}form{display:flex;align-items:end;flex-wrap:wrap;gap:12px}label{display:grid;gap:4px}input{width:9em}</style><main><a id="back">Review detection</a><h1>Trim continuous recording</h1><video controls playsinline preload="metadata"></video><form><label>Start (seconds)<input id="start" type="number" step=".001" min="0" required></label><button type="button" id="markStart">Set start here</button><label>End (seconds)<input id="end" type="number" step=".001" min="0" required></label><button type="button" id="markEnd">Set end here</button><button id="save" disabled>Save trim</button><button type="button" id="reset" disabled>Restore full recording</button></form><p role="status"></p></main><script>
const q=new URLSearchParams(location.search), id=q.get('id'),asset=q.get('asset'),v=document.querySelector('video'),form=document.querySelector('form'),msg=document.querySelector('[role=status]'),get=k=>document.getElementById(k),url='/api/email-review/trim',params='?'+new URLSearchParams({id,asset});let token;
get('back').href='/review-detection?id='+encodeURIComponent(id);
async function reply(r){const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){v.src=url+'/source'+params;const [info,state]=await Promise.all([fetch('/api/email-review?id='+encodeURIComponent(id)).then(reply),fetch(url+params).then(reply)]);token=info.token;if(v.readyState<1)await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej(Error('Recording unavailable'))});const r=state.request||{};get('start').value=r.enabled?r.start:0;get('end').value=r.enabled?r.end:v.duration.toFixed(3);get('save').disabled=get('reset').disabled=false}
get('markStart').onclick=()=>get('start').value=v.currentTime.toFixed(3);get('markEnd').onclick=()=>get('end').value=v.currentTime.toFixed(3);
async function store(reset){get('save').disabled=get('reset').disabled=true;msg.textContent='Saving trim…';try{const start=Number(get('start').value),end=Number(get('end').value);await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Lab-Token':token},body:JSON.stringify({id,asset,start,end,reset})}).then(reply);if(reset){get('start').value=0;get('end').value=v.duration.toFixed(3)}msg.textContent='Saved. The Archive publisher will update this recording.'}catch(e){msg.textContent=e.message}finally{get('save').disabled=get('reset').disabled=false}}
form.onsubmit=e=>{e.preventDefault();store(false)};get('reset').onclick=()=>store(true);init().catch(e=>msg.textContent=e.message);
</script></html>
